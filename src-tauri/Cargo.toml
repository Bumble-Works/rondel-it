[package]
name = "rondel-it"
version = "0.1.0"
description = "Rondel It — don't lose it, rondel it."
authors = ["Bumble Works"]
license = ""
repository = "https://github.com/Bumble-Works/rondel-it"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rondel_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-persisted-scope = "2.4"
