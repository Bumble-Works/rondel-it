name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'src/**'
      - 'public/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'src/**'
      - 'public/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test
