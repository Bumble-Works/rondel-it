name: Mac app

# Builds the Mac app. On PRs, only checks it builds. The Release workflow
# calls it with a version and publishes what it built.
on:
  # Any base branch, so stacked PRs are checked too.
  pull_request:
    paths:
      - '.github/workflows/mac-app.yml'
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'src-tauri/**'
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the app (x.y.z)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mac-app-${{ github.ref }}-${{ inputs.version || 'check' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Rust (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        env:
          VERSION: ${{ inputs.version }}
        # A release stamps its version into the app; a PR check uses the one in tauri.conf.json.
        run: |
          if [ -n "$VERSION" ]; then
            npx tauri build --target universal-apple-darwin --bundles app --config "{\"version\":\"$VERSION\"}"
          else
            npx tauri build --target universal-apple-darwin --bundles app
          fi

      - name: Package
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Rondel It.app"
          ditto -c -k --keepParent "$APP" RondelIt-macos.zip

      - name: Hand the app to the Release workflow
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: RondelIt-macos
          path: RondelIt-macos.zip
          if-no-files-found: error
          retention-days: 7
