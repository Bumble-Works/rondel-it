name: Release

# Run by hand (Actions → Release → Run workflow) to publish what's on main as a
# new version: bumps the latest vX.Y.Z tag, builds the Mac and Windows apps
# with that version, and publishes them as the latest release (install.sh
# installs the Mac app from it; Windows downloads RondelIt-windows-setup.exe).
# latest.json and the signed updater files let installed apps update themselves.
# The notes list every PR merged since the previous release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release the next version'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time, so two runs can't pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Before the first vX.Y.Z tag, versions continue from the last per-merge build.
  BASE_VERSION: 0.1.57
  BASE_TAG: build-57

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main; this run is on ${{ github.ref_name }}."
          exit 1

      - name: Checkout (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$LATEST" ]; then
            CURRENT="${LATEST#v}"
            PREVIOUS_TAG="$LATEST"
          else
            CURRENT="$BASE_VERSION"
            PREVIOUS_TAG="$BASE_TAG"
          fi

          if [ "$(git rev-list --count "$PREVIOUS_TAG..HEAD")" = "0" ]; then
            echo "::error::Nothing new on main since $PREVIOUS_TAG; there's nothing to release."
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP' (expected patch, minor or major)."; exit 1 ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"

          echo "Releasing $VERSION ($BUMP bump from $CURRENT; notes since $PREVIOUS_TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/desktop-apps.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the built apps
        uses: actions/download-artifact@v8
        with:
          pattern: RondelIt-*
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Fails if a signature is missing or empty, so no release ships a broken manifest.
      - name: Write the updater manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/updater-manifest.mjs "$VERSION" "$GITHUB_REPOSITORY" .

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          gh release create "v$VERSION" RondelIt-macos.zip RondelIt-windows-setup.exe scripts/install.sh \
            RondelIt-macos.app.tar.gz RondelIt-macos.app.tar.gz.sig RondelIt-windows-setup.exe.sig latest.json \
            --target "$GITHUB_SHA" \
            --title "Rondel It $VERSION" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_TAG" \
            --latest

  # The browser demo at https://bumble-works.github.io/rondel-it/, built from the
  # released commit. It lives here because a release published with GITHUB_TOKEN
  # doesn't start other workflows. Needs Settings → Pages → Source: GitHub Actions.
  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build the browser version for /rondel-it/
        env:
          PAGES_BASE: /rondel-it/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
